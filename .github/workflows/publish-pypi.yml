name: Publish Python SDK to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC). The workflow holds no
# long-lived API token, so there is no secret in this repository that could
# leak and be used to publish a malicious release.
#
# One-time setup on PyPI (account: the Kernlab-001 owner account):
#   Project -> Manage -> Publishing -> add a GitHub publisher with
#     Repository:      Kernlab-001/open-extensions
#     Workflow name:  publish-pypi.yml
#     Environment:    pypi
#   The "Environment" field must match the `environment:` key below, or be
#   left empty on both sides.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the OIDC token PyPI trusts

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/open-extensions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build every distribution
        working-directory: python-sdk
        run: |
          python -m pip install --upgrade build twine
          for p in packages/*/; do
            python -m build "$p" --outdir dist
          done

      - name: Check the built artifacts
        working-directory: python-sdk
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-sdk/dist/
