name: CodeQL

# Static analysis for the Python SDK. CodeQL is free on public repositories
# and scans every push and pull request, which is the cheapest way to catch
# a parsing bug that an attacker could otherwise reach through a crafted
# .memx file.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
