version: 2
updates:
  # Each distribution has its own pyproject.toml, so Dependabot is pointed at
  # the package directories rather than at python-sdk/.
  - package-ecosystem: pip
    directories:
      - /python-sdk/packages/open-extensions
      - /python-sdk/packages/open-extensions-core
      - /python-sdk/packages/open-extensions-memx
      - /python-sdk/packages/open-extensions-stepx
      - /python-sdk/packages/open-extensions-gridv
      - /python-sdk/packages/open-extensions-podx
      - /python-sdk/packages/open-extensions-wapp
      - /python-sdk/packages/open-extensions-tlock
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # argon2-cffi and cryptography are the crypto-relevant dependencies.
      # Keep them in one pull request so a security fix is reviewed as a unit.
      crypto:
        patterns:
          - "argon2-cffi*"
          - "cryptography*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
