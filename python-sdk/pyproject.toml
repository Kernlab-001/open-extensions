[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-extensions"
version = "0.1.0"
description = "Python reference SDK for the Open Extensions file-format family"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Extensions Contributors" }]
keywords = ["file-formats", "memx", "interoperability", "encryption"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: File Formats",
]
dependencies = [
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20", "build>=1.2.2"]

[project.scripts]
open-extensions = "open_extensions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
