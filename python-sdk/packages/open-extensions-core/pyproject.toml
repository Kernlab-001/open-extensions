[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-extensions-core"
version = "0.2.0"
description = "Shared container helpers and the open-extensions command line for the Open Extensions file-format family"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Open Extensions Contributors" }]
keywords = ["file-formats", "interoperability", "canonical-json"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: File Formats",
]
dependencies = [
  "jsonschema>=4.20",
]

[project.scripts]
open-extensions = "open_extensions.cli:main"

[project.urls]
Homepage = "https://github.com/Kernlab-001/open-extensions"
Repository = "https://github.com/Kernlab-001/open-extensions"
Changelog = "https://github.com/Kernlab-001/open-extensions/blob/main/CHANGELOG.md"
Issues = "https://github.com/Kernlab-001/open-extensions/issues"
"Security Policy" = "https://github.com/Kernlab-001/open-extensions/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_extensions*"]
namespaces = true

[tool.setuptools.package-data]
# The JSON Schemas ship with the package so that schema validation works for
# a plain pip install, not only inside a checkout.
"open_extensions.schemas" = ["*.json"]
